name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Lint / Typecheck / Test / Synth
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm run type-check

      - run: npm run test

      - name: CDK synth (validate infrastructure)
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
          CDK_DEFAULT_REGION: ${{ secrets.CDK_DEFAULT_REGION || 'us-west-2' }}
        run: npx cdk synth

