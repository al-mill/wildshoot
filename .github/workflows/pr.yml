name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  checks:
    name: Lint / Typecheck / Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npm run type-check

      - run: npm run test

  diff:
    name: CDK diff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PR_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-west-2' }}

      - name: CDK diff
        id: cdk_diff
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-west-2' }}
        # Staging is what merging changes; production shows settings only it has.
        # Keep cdk's exit code (not tee's) so a failed synth shows in the comment.
        run: |
          set -o pipefail
          status=0
          {
            npx cdk diff --context stage=staging 2>&1 &&
              npx cdk diff Wildshoot-production --context stage=production 2>&1
          } | tee cdk-diff.txt || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Post diff to PR
        uses: actions/github-script@v7
        env:
          DIFF_STATUS: ${{ steps.cdk_diff.outputs.status }}
        with:
          script: |
            const { readFileSync } = require('fs');
            const { formatDiff, HEADER } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/cdk-diff-comment.mjs`
            );
            const body = formatDiff(
              readFileSync('cdk-diff.txt', 'utf8'),
              Number(process.env.DIFF_STATUS)
            );

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.data.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.startsWith(HEADER)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # After the comment, so a failed diff is both posted and a red check.
      - name: Fail if cdk diff failed
        if: steps.cdk_diff.outputs.status != '0'
        run: exit 1

  changes:
    name: Summarise changed services
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: diff
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          CDK_CHANGED=$(git diff --name-only $BASE $HEAD | (grep '^cdk/' || true) | wc -l | tr -d ' ')
          LAMBDA_CHANGED=$(git diff --name-only $BASE $HEAD | (grep '^lambda/' || true) | wc -l | tr -d ' ')
          FRONTEND_CHANGED=$(git diff --name-only $BASE $HEAD | (grep -E '^(pages|components|composables|stores|layouts)/' || true) | wc -l | tr -d ' ')

          echo "cdk=$CDK_CHANGED" >> $GITHUB_OUTPUT
          echo "lambda=$LAMBDA_CHANGED" >> $GITHUB_OUTPUT
          echo "frontend=$FRONTEND_CHANGED" >> $GITHUB_OUTPUT

          SUMMARY=""
          [ "$CDK_CHANGED" -gt 0 ] && SUMMARY="${SUMMARY}* **Infrastructure (CDK):** ${CDK_CHANGED} file(s) changed\n"
          [ "$LAMBDA_CHANGED" -gt 0 ] && SUMMARY="${SUMMARY}* **Lambda functions:** ${LAMBDA_CHANGED} file(s) changed\n"
          [ "$FRONTEND_CHANGED" -gt 0 ] && SUMMARY="${SUMMARY}* **Frontend:** ${FRONTEND_CHANGED} file(s) changed\n"
          [ -z "$SUMMARY" ] && SUMMARY="* No service files changed\n"

          echo "summary<<__OUTPUT__" >> "$GITHUB_OUTPUT"
          echo -e "$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "__OUTPUT__" >> $GITHUB_OUTPUT

      - name: Post service summary to PR
        uses: actions/github-script@v7
        with:
          script: |
            const lines = `${{ steps.diff.outputs.summary }}`;
            const body = `## Services affected\n\n${lines}`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.data.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.startsWith('## Services affected')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
