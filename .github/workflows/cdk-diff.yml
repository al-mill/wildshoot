name: CDK Diff

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  diff:
    name: 'CDK Diff: ${{ matrix.stage }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [staging, production]
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.CDK_DEFAULT_REGION || 'us-west-2' }}

      - name: Run CDK diff
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
          CDK_DEFAULT_REGION: ${{ secrets.CDK_DEFAULT_REGION || 'us-west-2' }}
        run: |
          npx cdk diff "Wildshoot-${{ matrix.stage }}" \
            --context stage=${{ matrix.stage }} \
            2>&1 | tee /tmp/cdk_diff_${{ matrix.stage }}.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: cdk-diff-${{ matrix.stage }}
          path: /tmp/cdk_diff_${{ matrix.stage }}.txt
          if-no-files-found: error

  comment:
    name: Post diff comment
    runs-on: ubuntu-latest
    needs: diff
    permissions:
      pull-requests: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cdk-diff-*
          merge-multiple: false

      - name: Build comment
        run: |
          COMMENT_FILE="cdk_diff_comment.md"
          echo "### CDK Diff" > "$COMMENT_FILE"
          echo "" >> "$COMMENT_FILE"
          echo "_What will change when this PR merges to each environment:_" >> "$COMMENT_FILE"

          for dir in cdk-diff-*/; do
            STAGE="${dir#cdk-diff-}"
            STAGE="${STAGE%/}"
            DIFF_FILE="$dir/cdk_diff_${STAGE}.txt"

            echo "" >> "$COMMENT_FILE"

            if [ ! -f "$DIFF_FILE" ]; then
              echo "**${STAGE}**: ⚠️ Diff file not found" >> "$COMMENT_FILE"
              continue
            fi

            if grep -qE "There were no differences|No stacks match" "$DIFF_FILE"; then
              echo "**${STAGE}**: ✅ No changes" >> "$COMMENT_FILE"
            elif grep -qE "\[-\]|Destroy|destroy" "$DIFF_FILE"; then
              {
                echo "<details>"
                echo "<summary><strong>${STAGE}</strong> — ⚠️ Contains destructive changes</summary>"
                echo ""
                echo '```'
                cat "$DIFF_FILE"
                echo '```'
                echo "</details>"
              } >> "$COMMENT_FILE"
            else
              {
                echo "<details>"
                echo "<summary><strong>${STAGE}</strong> — 🔧 Has changes</summary>"
                echo ""
                echo '```'
                cat "$DIFF_FILE"
                echo '```'
                echo "</details>"
              } >> "$COMMENT_FILE"
            fi
          done

      - name: Post PR comment
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: cdk_diff_comment.md
          comment-tag: cdk_diff

  cleanup:
    name: Clean up artifacts
    runs-on: ubuntu-latest
    needs: comment
    if: always()
    steps:
      - uses: geekyeggo/delete-artifact@v5
        with:
          name: cdk-diff-*
