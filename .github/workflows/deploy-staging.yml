name: Deploy → Staging

# Every merge to main deploys staging; run it by hand to redeploy main. The
# staging environment only allows main, because this role can also deploy production.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      # Backs up the environment's main-only rule, which lives in repo settings.
      - name: Check the run is on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Staging deploys run from main only, not $GITHUB_REF"
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-west-2' }}

      - name: Deploy to staging
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-west-2' }}
        run: npx cdk deploy Wildshoot-staging --context stage=staging --require-approval never

      - name: Summary
        # Via env, not inline: a branch name can contain $(...), which would run as shell.
        env:
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "### Deployed to staging :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`$BRANCH\`" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`$COMMIT\`" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: @$ACTOR" >> $GITHUB_STEP_SUMMARY
